# Regionvægtene på geografisiderne. Nøglerne er databasens regionskoder (portfolio.geo_region):
# NORTH_AMERICA, EUROPE og ROW (resten af verden). Vægtene er i procent og summerer til ca. 100.
# Uden dette afsnit vises geografisiderne uden benchmark.
# Vægtene er landevægtene i ETF'er, der følger indeksene, lagt sammen til regioner:
# Nordamerika = USA + Canada, Europa = de oplyste europæiske lande, og Resten af verden = de
# øvrige oplyste lande + resten op til 100 % (lande, der ikke er oplyst). Europa er derfor lidt
# undervurderet (Sverige, Danmark, Spanien, Italien m.fl. er ikke oplyst). Det står ikke på
# sliderne (brugerens valg).
regioner:
  MSCI ACWI:
    NORTH_AMERICA: 66.64    # USA 63,59 + Canada 3,05
    EUROPE: 9.71            # Storbritannien 3,20 + Frankrig 2,10 + Tyskland 2,13 + Schweiz 2,28
    ROW: 23.65              # Japan 4,93 + Kina 3,14 + Taiwan 2,31 + Indien 1,65 + ikke oplyst 11,62
  # MSCI World:
  #   NORTH_AMERICA: 75.10    # USA 71,91 + Canada 3,19
  #   EUROPE: 12.41           # Storbritannien 3,61 + Frankrig 2,75 + Tyskland 2,57 + Schweiz 2,34
  #                           # + Nederlandene 1,14
  #   ROW: 12.49              # Japan 5,15 + Australien 1,69 + ikke oplyst 5,65

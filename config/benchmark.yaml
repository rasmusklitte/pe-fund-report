# Sektorvægte (GICS) og regionvægte i MSCI-indeksene, vist som benchmark på branche- og
# geografisiderne.
#
# Nøglerne er databasens sektorkoder (portfolio.industry.industry_code), så de passer til
# porteføljens sektorer uanset de danske navne. Vægtene er i procent og summerer til ca. 100.
# dato: den dato, MSCI har opgjort vægtene pr.; står den tom, vises ingen dato på sliden.
# Opdater tallene, når der kommer en ny faktaark fra MSCI.
# Kun MSCI ACWI vises for tiden; MSCI World står udkommenteret til senere brug. Hvert indeks,
# der står her, får sit eget bånd under kortene.


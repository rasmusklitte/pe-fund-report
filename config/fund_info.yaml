# Stamdata, som ikke findes i PE-databasen: fondsbeskrivelse, benchmark og
# virksomhedsbeskrivelser. Geografi, segment, løbetid og fondsstørrelse hentes fra
# rpt.v_fund_master.
#
# status: udkast   -> teksten er skrevet af Claude ud fra almen viden om forvalteren og er
#                     IKKE gennemgået. Kun til intern opfølgning: decket får ingen note, men
#                     bygningen advarer, indtil status ændres til "ok".
# estimerede_cashflows -> indbetalinger/udlodninger, der mangler i databasen. LP-fortegn
#                     (betalt < 0). Bruges kun i IRR-beregningen og i historikgrafen. Hvert
#                     skøn skal have investor (investor_code), for cash flows hører til
#                     investor × fond:
#                       - investor: MOTORTRAMP
#                         dato: 2024-06-30
#                         beloeb: -943382
#                         note: Draw down 14 (mellem 10.04.2024 og 19.09.2024)
#                     Når meddelelsen er registreret, udelades skønnet, og bygningen beder
#                     om at slette det her.
#
# Valgfri felter (udelades roligt; sliden viser "n/a" eller springer feltet over):
# benchmark        -> benchmarkets navn, fx "iShares MSCI ACWI Acc (EUR)". Kun teksten; der
#                     hentes ikke afkast fra nogen kilde. Vises over fondsnavnet i Lange tilsagn.
# virksomheder     -> pr. porteføljeselskab. Nøglen skal matche "name" i rpt.v_portfolio_holding
#                     præcis. beskrivelse/ejerandel/stemmer er alle valgfrie; ejerandel og
#                     stemmer angives som andel (0,58 = 58 %). Vises på virksomhedsprofilerne.
# prognose         -> fondens afvigelser fra sin profil i config/cashflow_profiler.yaml, fx
#                     prognose: {profil: Secondaries, bow: 1.2}. Felterne er profilens
#                     (kaldsrater, kald_til_aar, vaekst, bow, udbytte, loebetid_aar).

# CATACAP3 bygger på CataCap III's kvartalsrapport for Q3 2026 (dokument 91565, s. 3-6, 15,
# 20, 23 og 28-29); SEED4 på Seed Capital IV's for Q3 2026 (dokument 91154, s. 3-13).
# Ejerandelene er uudvandede (»undiluted«), som for SEED5.

CATACAP3:
  status: udkast
  beskrivelse: >-
    CataCap er en dansk kapitalfond med base i København. CataCap III investerer i små og
    mellemstore danske virksomheder, typisk som majoritetsejer, og arbejder med vækst,
    internationalisering og tilkøb i partnerskab med ledelse og medejere. Ultimo september
    2026 bestod porteføljen af fem selskaber inden for hobbyartikler, genanvendelse, digital
    kommunikation, ingeniørrådgivning og databeskyttelse. I kvartalet købte fonden
    B4Restore, Thranekær gennemførte tre tilkøb, og en salgsproces for Enwerdi er indledt.
  virksomheder:
    The Army Painter:
      beskrivelse: >-
        Opkøbt i 2023. Førende brand inden for maling og tilbehør til brætspil (fx Warhammer).
      ejerandel: 0.58
      stemmer: 0.67
    Enwerdi:
      beskrivelse: >-
        Opkøbt i 2023. NLM Vantinge genanvender organiske biprodukter til bio-olie, biogas
        og foder.
      ejerandel: 0.80
      stemmer: 0.70
    e-Boks:
      beskrivelse: >-
        Opkøbt i 2025. Sikker digital platform til kommunikation mellem det offentlige,
        virksomheder og privatpersoner.
      ejerandel: 1.00
      stemmer: 1.00
    Thranekær:
      beskrivelse: >-
        Opkøbt i 2025. Dansk ingeniørrådgivning, dannet ved en fusion af BSL, Ucon og
        Dominia.
      ejerandel: 0.52
      stemmer: 0.67
    B4Restore:
      beskrivelse: >-
        Opkøbt i 2026. Backup, lagring og business continuity som abonnement til
        virksomheder.
      ejerandel: 0.60
      stemmer: 0.60

SEED4:
  status: udkast
  beskrivelse: >-
    Seed Capital er en dansk venturefond, der investerer i teknologivirksomheder i de
    tidligste faser (pre-seed og seed) og følger op i senere runder. Fond IV har primært
    fokus på danske software- og techselskaber, og investeringsperioden udløb i marts 2025.
    Ultimo september 2026 bestod porteføljen af otte danske selskaber, primært inden for
    software, desuden fintech, markedspladser og digital sundhed, med FLATPAY som langt den
    største position. I kvartalet deltog fonden i interne kapitalrunder i Landfolk og Embla;
    der var ingen exits.
  virksomheder:
    FLATPAY:
      beskrivelse: >-
        Investeret i 2022. Leverandør af betalingstransaktioner og POS-løsninger.
      ejerandel: 0.176
    Landfolk:
      beskrivelse: >-
        Investeret i 2023. Online platform for high-end ferieudlejning.
      ejerandel: 0.210
    Starred:
      beskrivelse: >-
        Investeret i 2022. SaaS-værktøj til at måle og styre kandidaters oplevelse i
        rekrutteringsforløb.
      ejerandel: 0.099
    Understory:
      beskrivelse: >-
        Investeret i 2024. Samlet SaaS-løsning til udbydere af ture og oplevelser.
      ejerandel: 0.204
    Risika:
      beskrivelse: >-
        Investeret i 2021. SaaS-værktøj til kreditvurdering af virksomheder.
      ejerandel: 0.217
    Embla:
      beskrivelse: >-
        Investeret i 2023. Online vægttabsprogram med eller uden GLP-1-medicin.
      ejerandel: 0.270
    Embankment:
      beskrivelse: >-
        Investeret i 2024. Teknologibaseret fondsadministration for kapitalforvaltere og
        deres investorer.
      ejerandel: 0.178
    Tembi:
      beskrivelse: >-
        Investeret i 2024. Online platform til markedsindsigt.
      ejerandel: 0.225
  # Draw down 14 og 16 stod her som skønnede kapitalkald; de er nu registreret i databasen
  # (dokument 66005 og 66006) og er derfor slettet her.

# SEED5 bygger på Seed Capital V's kvartalsrapport for Q3 2026 (dokument 91558): fondsoversigten
# s. 1 og selskabssiderne s. 5-13. Ejerandelene er uudvandede (»undiluted«).

SEED5:
  status: udkast
  beskrivelse: >-
    Seed Capital V er Seed Capitals femte danske venturefond. Fonden investerer i tech- og
    softwarevirksomheder i seed-fasen, af og til pre-seed og series A, i Norden og Baltikum
    med hovedvægt på Danmark. Fonden lukkede endeligt i august 2026 med tilsagn på 967 mio.
    kr., og ultimo september 2026 bestod porteføljen af ni selskaber inden for bl.a. software,
    cybersikkerhed, fintech og AI.
  virksomheder:
    Blackbird Coffee:
      beskrivelse: >-
        Investeret i 2025. Kaffemaskiner, kaffe og service til virksomheder som abonnement
        med et fast antal kopper om måneden, styret af egen software.
      ejerandel: 0.236
    Pluto.markets:
      beskrivelse: >-
        Investeret i 2026. Investeringsplatform uden kurtage til aktier, ETF'er og krypto med
        brøkdele af aktier og flere valutaer.
      ejerandel: 0.185
    Norlix:
      beskrivelse: >-
        Investeret i 2026. Digital platform for forsikrings- og pensionsmægling til
        virksomheder.
      ejerandel: 0.251
    Moxso:
      beskrivelse: >-
        Investeret i 2025. AI-drevet træning i cybersikkerhed for medarbejdere med
        phishing-simuleringer og overvågning af datalæk.
      ejerandel: 0.206
    Oplane:
      beskrivelse: >-
        Investeret i 2026. AI-værktøj, der løbende gennemgår softwarekode for
        sikkerhedsrisici.
      ejerandel: 0.198
    Cernel:
      beskrivelse: >-
        Investeret i 2025. AI-værktøj, der strukturerer og beriger produktdata for
        webbutikker og forbedrer søgemaskineplacering og konvertering.
      ejerandel: 0.214
    Fortiv:
      beskrivelse: >-
        Investeret i 2025. Software til beredskabsstyring (business continuity), compliance og
        risiko i store virksomheder.
      ejerandel: 0.208
    Repodo:
      beskrivelse: >-
        Investeret i 2026. AI-baseret revisionsfirma, der reviderer alle transaktioner
        løbende med AI-agenter.
      ejerandel: 0.067
    Berserk:
      beskrivelse: >-
        Investeret i 2026. AI-baseret platform, der samler virksomheders værktøjer til
        overvågning af software og finder årsagen til fejl.
      ejerandel: 0.028

KAPE20:
  status: ok
  beskrivelse: >-
    K Alternativ Private Equity 2020 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn til syv underliggende kapitalfonde,
    primært buyout-fonde i Europa og Nordamerika samt en secondaries-fond.

KAPE21:
  status: ok
  beskrivelse: >-
    K Alternativ Private Equity 2021 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn til syv underliggende kapitalfonde,
    primært buyout-fonde i Europa og Nordamerika.

KAPE22:
  status: ok
  beskrivelse: >-
    K Alternativ Private Equity 2022 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn
    til 11 underliggende kapitalfonde hos otte forvaltere, primært buyout-fonde i
    Europa og Nordamerika.

# VINTAGEX bygger på Goldman Sachs' kapitalindkaldelser af 02.03, 27.08 og 20.10.2026 (dokument
# 91559-91561), som beskriver de opkøb, kaldene finansierer. Der er endnu ingen kvartalsrapport.

VINTAGEX:
  status: ok
  beskrivelse: >-
    Vintage X er Goldman Sachs Asset Managements secondaries-fond i Vintage-serien.
    Fonden køber eksisterende fondsandele af institutionelle investorer, der ønsker at
    sælge, typisk porteføljer af andele i buyout-fonde i Nordamerika og Europa, og
    investerer desuden i continuation vehicles, hvor en forvalter fører et enkelt selskab
    videre i en ny struktur. Fonden er i sin investeringsperiode og har bl.a. købt
    porteføljer fra statsinvesteringsfonde og pensionskasser.

# PPPE2 og PPPC2 er Petersen & Partners' egne feeder-selskaber: Motortramp investerer i dem,
# og de investerer videre i én underliggende fond hver. Beskrivelserne handler derfor om den
# underliggende fond. Benchmark er hentet fra "Slides vdr. Alternativer".
# PPPC bygger på PSCP IV's regnskab (dokument 13693) for Q2 2026. PPPE og PPPE2 bygger på
# NEP V's og NEP VI's rapporter pr. 30.09.2026, som endnu er udkast ("... September 30,
# 2026 - DRAFT").

PPPE:
  status: udkast
  beskrivelse: >-
    Petersen & Partners Private Equity investerer i Newbury Equity Partners V, en
    sekundærfond, der køber eksisterende fondsandele af investorer, der ønsker at sælge,
    suppleret med enkelte co-investeringer. Fonden har givet tilsagn for hele sin kapital og
    foretager ikke flere nye transaktioner, så fremtidige kapitalkald går primært til de
    underliggende fondes resterende tilsagn. Ultimo september 2026 havde fonden eksponering
    til 119 underliggende fonde, ni co-investeringer og omkring 1.975 selskaber,
    hovedsageligt i Nordamerika (76 %) og Europa (23 %).

PPPC:
  status: ok
  beskrivelse: >-
    Petersen & Partners Private Credit investerer i Park Square Capital Partners IV, der yder
    juniorlån til kapitalfondes opkøb af mellemstore og store virksomheder. Fondens
    investeringsperiode sluttede i juli 2025. Ultimo juni
    2026 bestod porteføljen af 29 investeringer, koncentreret om sundhed og life science,
    software og IT samt erhvervsservice, og de største lande er USA, Storbritannien og
    Frankrig.

PPPE2:
  status: udkast
  beskrivelse: >-
    Petersen & Partners Private Equity II investerer i Newbury Equity Partners VI, en
    sekundærfond. Newbury køber eksisterende tilsagn af investorer, der ønsker at sælge, så
    de underliggende fonde er langt i deres investeringsperiode, og kapitalen ventes betalt
    tilbage hurtigere end i en primærfond. I tredje kvartal 2026 købte fonden andele i fire
    amerikanske buyout-fonde fra et amerikansk family office, og Newbury venter at kalde
    yderligere kapital til nye transaktioner. Ultimo september 2026 havde fonden eksponering
    til 30 underliggende fonde, én co-investering og omkring 311 selskaber, hovedsageligt i
    Nordamerika (78 %) og Europa (22 %).

PPPC2:
  status: ok
  beskrivelse: >-
    Petersen & Partners Private Credit II investerer i Park Square Capital Partners V,
    der yder lån til mellemstore virksomheder i Europa og Nordamerika, typisk i
    forbindelse med kapitalfondes opkøb. Porteføljen er koncentreret om sundhed og life
    science, industri samt software og IT, og de største lande er Storbritannien, USA,
    DACH og Frankrig.

# PPMAR er Petersen & Partners' feeder-selskab i Maritime Investment Fund III (MIF3).
# Beskrivelsen bygger på MIF III's kvartalsrapport for Q3 2026 (dokument 91268, s. 5, 7, 32-34
# og 38-43): Norwind Passat var under opførelse pr. 30.09 og blev leveret i oktober.

PPMAR:
  status: udkast
  beskrivelse: >-
    Petersen & Partners Maritime investerer i Maritime Investment Fund III, der forvaltes af
    Navigare Capital Partners. Fonden køber moderne skibe med faste lejeaftaler med en række
    modparter og finansierer dem konservativt med sigte på et stabilt tocifret driftsafkast.
    Ultimo september 2026 bestod porteføljen af 12 skibe: syv offshore wind-servicefartøjer
    (CSOV), et LPG-tankskib og fire containerskibe. Seks var nybygninger: de fire
    containerskibe, der leveres i 2027-2028, servicefartøjet Norwind Marin, der leveres i
    februar 2027, og Norwind Passat, der blev leveret i oktober 2026.

# PD3LGT er en fund of funds fra Alternative Equity Partners, der investerer i LGT's to
# europæiske private debt-fonde. Beskrivelsen bygger på fondsinformationen i Q2 2026-rapporten
# (master_data_source i rpt.v_fund_master).

PD3LGT:
  status: ok
  beskrivelse: >-
    Private Debt III LGT er en fund of funds forvaltet af Alternative Equity Partners.
    Fonden investerer i LGT Capital Partners' LGT European Private Debt III og III B, der
    primært yder unitranche-lån til mellemstore europæiske virksomheder med en EBITDA på
    5-25 mio. EUR, typisk i forbindelse med kapitalfondes opkøb.
 

# HOME er en dansk ejendomsfond med løbende tilsagn. Beskrivelsen bygger på Home.Earths
# investorrapport for Q3 2026 (dokument 91272, s. 3, 5 og 7).

HOME:
  evergreen: true
  status: udkast
  beskrivelse: >-
    Home.Earth er en dansk evergreen-ejendomsfond (K/S), der køber, udvikler og driver
    bæredygtige boliger i hovedstadsområdet. Ultimo september 2026 bestod porteføljen af
    udlejningsejendommene C.F. Møllers Have, Nærheden, Filmlageret og de nyerhvervede
    ejendomme i Tingbjerg (fire ejendomme med 232 boliger), byggeriet HTC samt projekterne
    NEFA, Smedeland og Københavnsvej. Ejendomsværdien (GAV) var 319 mio. EUR, delvist
    finansieret med realkredit- og byggelån samt brofinansiering. Fonden har indledt salget
    af Filmlageret. En del af afkastet går til lejere og lokalsamfund.

# CRED er en open-ended dansk ejendomsfond. Beskrivelsen bygger på Rubik Managements
# investeringsrapport for K3 2026 (dokument 91187, s. 4, 11-12 og 20).

CRED:
  evergreen: true
  status: udkast
  beskrivelse: >-
    Commercial Real Estate Denmark er en dansk evergreen-ejendomsfond (P/S) forvaltet af
    Rubik Management. Ultimo september 2026 ejede fonden 27 erhvervsejendomme, primært
    kontorer i Københavnsområdet samt logistik i Trekantområdet og Billund. Ejendommene er
    bogført til 6,1 mia. kr. og belånt med 38,6 % på fondsniveau. Forvalteren arbejder med
    at nedbringe tomgangen på 16,9 % og sælge ikke-strategiske ejendomme; der er indgået en
    betinget aftale om salg af én ejendom og foreløbige aftaler om salg af to til.

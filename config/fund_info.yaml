  status: udkast
  beskrivelse: >-
    K Alternativ Private Equity 2021 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn til syv underliggende kapitalfonde,
    primært buyout-fonde i Europa og Nordamerika.

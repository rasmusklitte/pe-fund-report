# Stamdata, som ikke findes i PE-databasen: fondsbeskrivelse, benchmark og
# virksomhedsbeskrivelser. Geografi, segment, løbetid og fondsstørrelse hentes fra
# rpt.v_fund_master.
#
# status: udkast   -> teksten er skrevet af Claude ud fra almen viden om forvalteren og er
#                     IKKE gennemgået. Sliden får en fodnote, indtil status ændres til "ok".
# estimerede_cashflows -> indbetalinger/udlodninger, der mangler i databasen. LP-fortegn
#                     (betalt < 0). Bruges kun i IRR-beregningen og i historikgrafen.
#
# Valgfri felter (udelades roligt; sliden viser "n/a" eller springer feltet over):
# benchmark        -> benchmarkets navn, fx "iShares MSCI ACWI Acc (EUR)". Kun teksten; der
#                     hentes ikke afkast fra nogen kilde. Vises over fondsnavnet i Lange tilsagn.
# virksomheder     -> pr. porteføljeselskab. Nøglen skal matche "name" i rpt.v_portfolio_holding
#                     præcis. beskrivelse/ejerandel/stemmer er alle valgfrie; ejerandel og
#                     stemmer angives som andel (0,58 = 58 %). Vises på virksomhedsprofilerne.

CATACAP3:
  status: udkast
  beskrivelse: >-
    CataCap er en dansk kapitalfond med base i København. CataCap III investerer i
    små og mellemstore danske virksomheder, typisk som majoritetsejer, og arbejder med
    vækst, internationalisering og opkøb i partnerskab med ledelse og medejere.
  virksomheder:
    The Army Painter:
      beskrivelse: >-
        Opkøbt i 2023. Førende brand inden for maling og tilbehør til brætspil (fx Warhammer).
      ejerandel: 0.58
      stemmer: 0.67
    Enwerdi:
      beskrivelse: >-
        NLM Vantinge, opkøbt i 2023, arbejder med genanvendelse af organiske biprodukter
        inden for bio-olie, biogas og foder.
      ejerandel: 0.80
      stemmer: 0.70
    e-Boks:
      beskrivelse: >-
        Opkøbt i 2025. Sikker digital platform til kommunikation mellem det offentlige,
        virksomheder og privatpersoner.
      ejerandel: 1.00
      stemmer: 1.00

SEED4:
  status: udkast
  beskrivelse: >-
    Seed Capital er en dansk venturefond, der investerer i teknologivirksomheder i de
    tidligste faser (pre-seed og seed) og følger op i senere runder. Fond IV har
    primært fokus på danske og nordiske software- og techselskaber.
  virksomheder:
    FLATPAY:
      beskrivelse: >-
        Opkøbt i 2022. Leverandør af betalingstransaktioner og POS-løsninger.
      ejerandel: 0.208
    Landfolk:
      beskrivelse: >-
        Opkøbt i 2023. Online platform for high-end ferieudlejning.
      ejerandel: 0.201
  estimerede_cashflows:
    # Draw down 14 og 16 er ikke modtaget (docs/pdf-inventory.md). Beløbene følger af
    # GP'ens "contributed to date"; datoerne er skøn inden for det vindue, de ligger i.
    - dato: 2024-06-30
      beloeb: -943382
      note: Draw down 14 (mellem 10.04.2024 og 19.09.2024)
    - dato: 2024-11-15
      beloeb: -2172990
      note: Draw down 16 (mellem 19.09.2024 og 31.12.2024)

KAPE20:
  status: udkast
  beskrivelse: >-
    K Alternativ Private Equity 2020 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn til syv underliggende kapitalfonde,
    primært buyout-fonde i Europa og Nordamerika samt en secondaries-fond.

KAPE21:
  status: udkast
  beskrivelse: >-
    K Alternativ Private Equity 2021 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn til syv underliggende kapitalfonde,
    primært buyout-fonde i Europa og Nordamerika.

KAPE22:
  status: udkast
  beskrivelse: >-
    K Alternativ Private Equity 2022 er en fund of funds forvaltet af Alternative
    Equity Partners. Fonden har givet tilsagn
    til 11 underliggende kapitalfonde hos otte forvaltere, primært buyout-fonde i
    Europa og Nordamerika.

# PPPE2 og PPPC2 er Petersen & Partners' egne feeder-selskaber: Motortramp investerer i dem,
# og de investerer videre i én underliggende fond hver. Beskrivelserne handler derfor om den
# underliggende fond. Benchmark er hentet fra "Slides vdr. Alternativer".

PPPE2:
  status: udkast
  beskrivelse: >-
    Petersen & Partners Private Equity II A/S investerer i Newbury Equity Partners VI,
    en sekundærfond. Newbury køber eksisterende tilsagn af investorer, der ønsker at
    sælge, så de underliggende fonde er langt i deres investeringsperiode, og kapitalen
    ventes betalt tilbage hurtigere end i en primærfond. Ultimo juni 2026 havde fonden
    eksponering til 26 underliggende fonde og 269 selskaber.

PPPC2:
  status: udkast
  beskrivelse: >-
    Petersen & Partners Private Credit II A/S investerer i Park Square Capital Partners V,
    der yder lån til mellemstore virksomheder i Europa og Nordamerika, typisk i
    forbindelse med kapitalfondes opkøb. Porteføljen er koncentreret om sundhed og life
    science, industri samt software og IT, og de største lande er Storbritannien, USA,
    DACH og Frankrig.
 
